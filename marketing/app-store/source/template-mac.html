<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@600&display=block">
<style>
  /* Canvas: the Mac App Store 2880 × 1800 size. The Safari window is drawn at
     2× (a 1600 pt window round a 1600 × 1000 page) and scaled as a whole. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; }
  body {
    position: relative;
    color: #fff;
    font-family: "Manrope", system-ui, sans-serif;
    background:
      radial-gradient(90% 110% at 0% 0%, #3d86ff 0%, rgba(61,134,255,0) 55%),
      linear-gradient(135deg, #0b55df 0%, #0c3f9e 50%, #061c52 100%);
  }

  .copy { position: absolute; left: 80px; right: 80px; top: {{COPY_TOP}}px; text-align: center; }
  .headline {
    font-family: "Bebas Neue", sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: {{HEAD_SIZE}}px; line-height: .92; letter-spacing: .012em; white-space: nowrap;
    text-shadow: 0 4px 18px rgba(0,0,0,.28);
  }
  .sub {
    margin: {{SUB_GAP}}px auto 0; max-width: {{SUB_MAX}}px;
    font-size: {{SUB_SIZE}}px; line-height: 1.26; font-weight: 600; color: rgba(255,255,255,.9);
  }

  .window {
    position: absolute; left: 50%; top: {{WIN_TOP}}px;
    width: 3200px; height: 2104px; border-radius: 52px; overflow: hidden;
    transform-origin: top center; transform: translateX(-50%) scale({{K}});
    background: #16181c;
    box-shadow: 0 0 0 2px rgba(255,255,255,.14), 0 80px 200px rgba(1, 8, 32, .6), 0 24px 60px rgba(1, 8, 32, .35);
  }
  .toolbar {
    position: relative; height: 104px;
    background: linear-gradient(180deg, #2b2c31 0%, #232428 100%);
    border-bottom: 2px solid #0b0c0e;
  }
  .toolbar > * { position: absolute; top: 50%; transform: translateY(-50%); }
  .lights { left: 32px; display: flex; gap: 16px; }
  .lights i { display: block; width: 24px; height: 24px; border-radius: 50%; }
  .address {
    left: 50%; transform: translate(-50%, -50%); width: 1360px; height: 64px; border-radius: 32px;
    background: #3a3b40; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 24px;
  }
  .url {
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 27px; font-weight: 500;
    letter-spacing: -.1px; color: #ececee;
  }
  .ext { left: 2334px; width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .ext img { width: 40px; height: 40px; display: block; }
  .page { display: block; width: 3200px; height: 2000px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="headline" id="headline">{{HEADLINE}}</div>
    <div class="sub">{{SUB}}</div>
  </div>

  <div class="window">
    <div class="toolbar">
      <div class="lights">
        <i style="background:#ff5f57; box-shadow: inset 0 0 0 1.5px #e0443e"></i>
        <i style="background:#febc2e; box-shadow: inset 0 0 0 1.5px #dea123"></i>
        <i style="background:#28c840; box-shadow: inset 0 0 0 1.5px #1aab29"></i>
      </div>
      <!-- sidebar -->
      <svg style="left: 190px" width="44" height="34" viewBox="0 0 44 34"><rect x="2" y="2" width="40" height="30" rx="7" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3"/><path d="M16 2 V32" stroke="rgba(255,255,255,.78)" stroke-width="3"/></svg>
      <!-- back / forward -->
      <svg style="left: 282px" width="24" height="40" viewBox="0 0 24 40"><path d="M19 4 L5 20 L19 36" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg style="left: 344px" width="24" height="40" viewBox="0 0 24 40"><path d="M5 4 L19 20 L5 36" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <div class="address">
        <svg width="30" height="30" viewBox="0 0 30 30"><rect x="3" y="2" width="24" height="15" rx="4" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.6"/><path d="M3 22.5 H27 M3 28 H19" stroke="rgba(255,255,255,.7)" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span class="url">play.autodarts.com</span>
        <svg width="30" height="32" viewBox="0 0 30 32"><path d="M24 12.5 A10.5 10.5 0 1 1 15.5 6" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.6" stroke-linecap="round"/><path d="M13 1.8 L18 6 L13 10.2" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <div class="ext" title="Tools for Autodarts"><img src="img/icon-128.png" alt=""></div>

      <!-- share / new tab / tabs -->
      <svg style="left: 2928px" width="36" height="44" viewBox="0 0 36 44"><path d="M11 16 H6 a3 3 0 0 0 -3 3 V38 a3 3 0 0 0 3 3 H30 a3 3 0 0 0 3 -3 V19 a3 3 0 0 0 -3 -3 H25" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3" stroke-linecap="round"/><path d="M18 27 V3 M10 10 L18 2.5 L26 10" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg style="left: 3010px" width="34" height="34" viewBox="0 0 34 34"><path d="M17 3 V31 M3 17 H31" stroke="rgba(255,255,255,.78)" stroke-width="3.2" stroke-linecap="round"/></svg>
      <svg style="left: 3090px" width="42" height="38" viewBox="0 0 42 38"><rect x="3" y="11" width="28" height="24" rx="5" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3"/><path d="M11 5 a3 3 0 0 1 3 -3 H36 a3 3 0 0 1 3 3 V24 a3 3 0 0 1 -3 3" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3"/></svg>
    </div>
    <img class="page" src="{{IMG}}" alt="">
  </div>

<script>
  const h = document.getElementById("headline");
  const max = h.parentElement.clientWidth;
  let size = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > max && size > {{HEAD_MIN}}) { size -= 2; h.style.fontSize = size + "px"; }
  if (h.scrollWidth > max) h.style.whiteSpace = "normal";
</script>
</body>
</html>
