<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@600;700;800&display=block">
<style>
  /* Canvas: 1920 × 1080, Discord's landscape picture. The copy sits on the left, a
     Safari window round the 1600 × 1000 @2x capture on the right, and the pill's
     row of that capture, which is what Teams adds, enlarged over its foot. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    position: relative;
    color: #fff;
    font-family: "Manrope", system-ui, sans-serif;
    background:
      radial-gradient(90% 110% at 0% 0%, #3d86ff 0%, rgba(61,134,255,0) 55%),
      linear-gradient(135deg, #0b55df 0%, #0c3f9e 50%, #061c52 100%);
  }
  /* The two teams' colours, glowing behind the window. */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
  .glow.red { left: 820px; top: 640px; width: 620px; height: 420px; background: #b8323f; }
  .glow.blue { left: 1380px; top: 70px; width: 560px; height: 420px; background: #0b55df; opacity: .65; }

  .brand { position: absolute; left: 100px; top: 76px; display: flex; align-items: center; gap: 22px; }
  .logo { width: 92px; height: 92px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(1, 8, 32, .35); }
  .logo img { width: 66px; height: 66px; display: block; }
  .brand span { font-family: "Bebas Neue", sans-serif; font-size: 46px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; }

  .copy { position: absolute; left: 100px; top: 232px; width: 600px; display: flex; flex-direction: column; align-items: flex-start; }
  .kicker {
    display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 999px;
    background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.3);
    font-size: 21px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
  }
  .headline {
    margin-top: 22px; width: 100%;
    font-family: "Bebas Neue", sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: 158px; line-height: .9; letter-spacing: .01em; white-space: nowrap;
    text-shadow: 0 6px 24px rgba(0,0,0,.3);
  }
  .sub { margin-top: 24px; font-size: 31px; line-height: 1.32; font-weight: 600; color: rgba(255,255,255,.9); text-wrap: balance; }
  .points { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; list-style: none; }
  .points li { display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 700; line-height: 1.2; }
  .points i { flex: none; width: 18px; height: 18px; border-radius: 5px; box-shadow: 0 0 0 2px rgba(255,255,255,.2); }
  .points li:nth-child(odd) i { background: linear-gradient(to right, #6a1624, #b8323f); }
  .points li:nth-child(even) i { background: linear-gradient(to right, #374c98, #0b55df); }
  .platforms { position: absolute; left: 100px; bottom: 70px; font-size: 22px; font-weight: 600; letter-spacing: .02em; color: rgba(255,255,255,.72); }

  .window {
    position: absolute; left: 742px; top: 165px;
    width: 3200px; height: 2104px; border-radius: 52px; overflow: hidden;
    transform-origin: top left; transform: scale(.35625);
    background: #16181c;
    box-shadow: 0 0 0 3px rgba(255,255,255,.16), 0 90px 220px rgba(1, 8, 32, .62), 0 26px 64px rgba(1, 8, 32, .38);
  }
  .toolbar { position: relative; height: 104px; background: linear-gradient(180deg, #2b2c31 0%, #232428 100%); border-bottom: 2px solid #0b0c0e; }
  .toolbar > * { position: absolute; top: 50%; transform: translateY(-50%); }
  .lights { left: 32px; display: flex; gap: 16px; }
  .lights i { display: block; width: 24px; height: 24px; border-radius: 50%; }
  .address {
    left: 50%; transform: translate(-50%, -50%); width: 1360px; height: 64px; border-radius: 32px;
    background: #3a3b40; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 24px;
  }
  .url { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 27px; font-weight: 500; letter-spacing: -.1px; color: #ececee; }
  .ext { left: 2334px; width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .ext img { width: 40px; height: 40px; display: block; }
  .page { display: block; width: 3200px; height: 2000px; }

  /* The capture's pill row at 1.5× its size on the page: 0.75 of the @2x pixels. */
  .callout {
    position: absolute; left: {{CALLOUT_LEFT}}px; top: {{CALLOUT_TOP}}px;
    border-radius: 24px; overflow: hidden; background: #050a1a;
    box-shadow: 0 0 0 3px rgba(255,255,255,.3), 0 30px 80px rgba(1, 8, 32, .7), 0 10px 26px rgba(1, 8, 32, .45);
  }
  .callout img { display: block; width: {{CALLOUT_W}}px; height: {{CALLOUT_H}}px; }
</style>
</head>
<body>
  <div class="glow red"></div>
  <div class="glow blue"></div>

  <div class="brand">
    <div class="logo"><img src="img/icon-128.png" alt=""></div>
    <span>Tools for Autodarts</span>
  </div>

  <div class="copy">
    <div class="kicker">{{KICKER}}</div>
    <div class="headline" id="headline">{{HEADLINE}}</div>
    <div class="sub">{{SUB}}</div>
    <ul class="points">{{POINTS}}</ul>
  </div>
  <div class="platforms">{{PLATFORMS}}</div>

  <div class="window">
    <div class="toolbar">
      <div class="lights">
        <i style="background:#ff5f57; box-shadow: inset 0 0 0 1.5px #e0443e"></i>
        <i style="background:#febc2e; box-shadow: inset 0 0 0 1.5px #dea123"></i>
        <i style="background:#28c840; box-shadow: inset 0 0 0 1.5px #1aab29"></i>
      </div>
      <svg style="left: 190px" width="44" height="34" viewBox="0 0 44 34"><rect x="2" y="2" width="40" height="30" rx="7" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3"/><path d="M16 2 V32" stroke="rgba(255,255,255,.78)" stroke-width="3"/></svg>
      <svg style="left: 282px" width="24" height="40" viewBox="0 0 24 40"><path d="M19 4 L5 20 L19 36" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg style="left: 344px" width="24" height="40" viewBox="0 0 24 40"><path d="M5 4 L19 20 L5 36" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="address">
        <svg width="30" height="30" viewBox="0 0 30 30"><rect x="3" y="2" width="24" height="15" rx="4" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.6"/><path d="M3 22.5 H27 M3 28 H19" stroke="rgba(255,255,255,.7)" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span class="url">play.autodarts.com</span>
        <svg width="30" height="32" viewBox="0 0 30 32"><path d="M24 12.5 A10.5 10.5 0 1 1 15.5 6" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.6" stroke-linecap="round"/><path d="M13 1.8 L18 6 L13 10.2" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="ext" title="Tools for Autodarts"><img src="img/icon-128.png" alt=""></div>
      <svg style="left: 2928px" width="36" height="44" viewBox="0 0 36 44"><path d="M11 16 H6 a3 3 0 0 0 -3 3 V38 a3 3 0 0 0 3 3 H30 a3 3 0 0 0 3 -3 V19 a3 3 0 0 0 -3 -3 H25" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3" stroke-linecap="round"/><path d="M18 27 V3 M10 10 L18 2.5 L26 10" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg style="left: 3010px" width="34" height="34" viewBox="0 0 34 34"><path d="M17 3 V31 M3 17 H31" stroke="rgba(255,255,255,.78)" stroke-width="3.2" stroke-linecap="round"/></svg>
      <svg style="left: 3090px" width="42" height="38" viewBox="0 0 42 38"><rect x="3" y="11" width="28" height="24" rx="5" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3"/><path d="M11 5 a3 3 0 0 1 3 -3 H36 a3 3 0 0 1 3 3 V24 a3 3 0 0 1 -3 3" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3"/></svg>
    </div>
    <img class="page" src="img/{{CAPTURE}}" alt="">
  </div>

  <div class="callout"><img src="img/{{CALLOUT}}" alt=""></div>

<script>
  // The headline's longest line fills the column, never more: "kommen bald" is
  // wider than "are here", so it comes out smaller.
  const h = document.getElementById("headline");
  let size = parseFloat(getComputedStyle(h).fontSize);
  while (h.scrollWidth > h.clientWidth && size > 90) { size -= 2; h.style.fontSize = size + "px"; }
</script>
</body>
</html>
